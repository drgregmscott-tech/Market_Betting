name: Pick'em Weekly Recalibration Review

# WHAT THIS FILE IS
# ------------------
# A GitHub Actions workflow (see pickem_pipeline.yml's own header comment
# for what that term means) that activates Session 2.5's
# scripts/calibration/weekly_review.py on a real, recurring cadence
# (Session 2.20). weekly_review.py already implements the comparison this
# project needs (model's stated average confidence vs. real observed win
# rate, plus an edge-threshold effectiveness check) against
# data/pickem/outcome_log.csv (Session 2.18's real auto-graded rows) -- it
# was simply never being run. This workflow is the activation, not a new
# build.
#
# WHAT IT DOES, IN ORDER
# -----------------------
# 1. Checks out the repo and installs dependencies, same pattern as
#    pickem_pipeline.yml.
# 2. Runs `python scripts/calibration/weekly_review.py --run`, which reads
#    data/pickem/outcome_log.csv, appends one summary row to
#    data/pickem/review_log.csv, and prints its recommendation to the log.
# 3. Commits and pushes the updated review_log.csv back to this repo, so
#    the review history is a real, durable, growing record -- same commit
#    pattern as pickem_pipeline.yml (including its retry/rebase handling
#    for a moving origin/main), scoped to only this file's own output path.
# 4. (Session 2.23) Reads this run's `recalibration_suggested` flag from
#    review_log.csv and opens (or keeps open) a labeled GitHub Issue when
#    true, and closes it when false -- so a real recalibration need
#    surfaces as a persistent, notification-generating repo item instead
#    of depending on anyone remembering to open review_log.csv or the
#    dashboard. See weekly_review.py's own "SESSION 2.23 ADDITION" module
#    docstring section for why this check exists and what it measures.
#    (Session 2.42: this same flag now also fires on a real SHRINKAGE_
#    PRIOR_STRENGTH_K drift, not just sigma -- the issue body states both
#    gaps by name so the real cause is never ambiguous; see
#    weekly_review.py's "SESSION 2.42 ADDITION" module docstring section.)

on:
  # schedule:
    # Weekly, Monday 08:13 UTC -- deliberately not the exact top of the
    # hour, for the same reason pickem_pipeline.yml's cron avoids ":00"
    # (GitHub's documented busiest-slot warning).
    # - cron: "13 8 * * 1"
    # Schedule disabled 2026-09-18: product is unvalidated and doesn't need
    # a live cadence yet; this repo's Actions minutes were crowding out
    # DFS_Optimizer's. Re-enable by uncommenting the line above once ready
    # for regular automated runs again. Manual runs via workflow_dispatch
    # below still work in the meantime.
  workflow_dispatch: {}
    # Manual "Run workflow" button on GitHub's Actions tab, for testing
    # without waiting for the next scheduled Monday.

concurrency:
  group: pickem-weekly-review
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run-weekly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly recalibration review
        run: python scripts/calibration/weekly_review.py --run

      - name: Commit and push updated review log
        run: |
          git config user.name "pickem-weekly-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pickem/review_log.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Weekly recalibration review $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"

          push_ok=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              push_ok=true
              break
            fi
            echo "Push attempt $attempt/5 was rejected -- fetching and rebasing onto origin/main before retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase onto origin/main hit a real conflict -- stopping rather than guessing at a resolution. Manual intervention needed." >&2
              git rebase --abort
              exit 1
            fi
            sleep $((attempt * 3))
          done

          if [ "$push_ok" != "true" ]; then
            echo "::error::Failed to push after 5 retries against a moving origin/main." >&2
            exit 1
          fi

      - name: Flag or clear recalibration-needed issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("data/pickem/review_log.csv")
          last = df.iloc[-1]
          suggested = str(last.get("recalibration_suggested", "")).strip().lower() == "true"

          with open("recalibration_flag.txt", "w", encoding="utf-8") as f:
              f.write("true" if suggested else "false")
          with open("recalibration_body.txt", "w", encoding="utf-8") as f:
              f.write(
                  f"**Review:** {last['review_id']} ({last['run_at']})\n\n"
                  f"**Post-fit calibration gap (sigma):** {last.get('post_fit_calibration_gap', 'n/a')}\n\n"
                  f"**Post-fit calibration gap (shrinkage):** {last.get('post_shrinkage_calibration_gap', 'n/a')}\n\n"
                  f"{last.get('recommendation', '')}\n\n"
                  f"Full detail: `data/pickem/review_log.csv` (this row), "
                  f"`data/pickem/sigma_recalibration_log.csv` (sigma fit history), and "
                  f"`data/pickem/shrinkage_recalibration_log.csv` (shrinkage fit history)."
              )
          PY

          # SESSION 2.42: this flag now fires from EITHER a real sigma drift OR
          # a real shrinkage drift (weekly_review.py's build_recommendation()
          # ORs the two checks into one recalibration_suggested column) -- the
          # title/label stay drift-source-agnostic so a shrinkage-only trigger
          # doesn't get mislabeled "(sigma drift)"; the body above always states
          # both gaps by name so the real cause is never ambiguous.
          TITLE="Pick'em model recalibration suggested"
          LABEL="recalibration-suggested"

          # Idempotent -- fails silently if the label already exists.
          gh label create "$LABEL" --color FBCA04 \
            --description "weekly_review.py detected real sigma or shrinkage drift past its threshold" \
            2>/dev/null || true

          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')

          if [ "$(cat recalibration_flag.txt)" = "true" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body-file recalibration_body.txt
              echo "::warning::Recalibration still suggested this week -- updated issue #$EXISTING."
            else
              gh issue create --title "$TITLE" --label "$LABEL" --body-file recalibration_body.txt
              echo "::warning::Recalibration suggested -- opened a new tracking issue."
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" \
              --body "This week's post-fit calibration gap is back within threshold -- closing. See \`data/pickem/review_log.csv\` for this run's numbers."
            gh issue close "$EXISTING"
          fi

      - name: Upload log as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-review-log
          path: logs/weekly_review.log
          retention-days: 30
          if-no-files-found: ignore
