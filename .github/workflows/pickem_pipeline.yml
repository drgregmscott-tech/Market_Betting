name: Pick'em Pipeline

# WHAT THIS FILE IS
# ------------------
# A GitHub Actions "workflow" -- a set of instructions GitHub itself runs on
# a schedule, on a temporary computer GitHub provides (a "runner"), separate
# from your own PC. Every run starts from a completely fresh copy of this
# repo; nothing written to that temporary computer's disk survives past the
# end of the run unless this file explicitly saves it back to GitHub first.
#
# WHAT IT DOES, IN ORDER
# -----------------------
# 1. Checks out this repo onto the temporary computer.
# 2. Installs Python and this project's packages (requirements.txt).
# 3. Runs scripts/run_pipeline.py, which itself runs ingestion ->
#    estimation -> CLV logging in sequence (Session 2.7).
# 4. If that script succeeds, commits the updated data/pickem/clv_log.csv,
#    its snapshot, the new digest file, and the estimation stage's own
#    latest.csv (added 2026-09-02 -- see run() in pickem_model.py -- so
#    each stage's real per-row output, including model_status and
#    computed edge for every platform, is actually checkable after the
#    fact instead of only existing on a runner that's already gone) back
#    to this repo, using a
#    token GitHub generates automatically for every workflow run
#    (GITHUB_TOKEN) -- no separate password or secret needed. This step is
#    what makes clv_log.csv's history durable across runs; see
#    run_pipeline.py's own docstring for why that matters.
# 5. If step 3 fails or finds nothing to commit, the workflow stops there --
#    no commit happens, and the run shows as failed/red on GitHub's Actions
#    tab so a failure is never silent.

on:
  schedule:
    # Runs 7 minutes past every hour, in UTC (GitHub Actions schedules are
    # always UTC, regardless of where you are). Deliberately NOT at the
    # exact top of the hour (":00") -- GitHub's own documentation warns
    # that jobs scheduled for the exact top of the hour hit the busiest
    # slot on their infrastructure and are the most likely to be delayed
    # or skipped. Matches Windows Task Scheduler's hourly pattern
    # (SESSION_LOG.md, Session 2.2) -- just offset by a few minutes.
    #
    # Confirmed working: run #5 (2026-09-01, ~21:47 UTC) fired as a real
    # "Scheduled" trigger at the previous "*/5 * * * *" test setting,
    # after roughly 1h40m for GitHub to register the schedule following
    # a fresh push. That registration delay is a one-time thing per
    # schedule change, not an ongoing problem -- see SESSION_LOG.md
    # Session 2.7 for the full troubleshooting trail.
    - cron: "7 * * * *"
  workflow_dispatch: {}
    # Adds a manual "Run workflow" button on GitHub's Actions tab, so this
    # can be triggered by hand for testing without waiting for the next
    # scheduled hour.

# Prevents two runs from overlapping if one run happens to take longer than
# an hour -- a second scheduled run will wait for the first to finish rather
# than starting in parallel and racing to write the same files.
concurrency:
  group: pickem-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  # Required so the final step in this workflow is allowed to commit and
  # push back to this repo using the automatic GITHUB_TOKEN.

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (ingestion -> estimation -> CLV logging)
        env:
          # CFB plug-in (Session 2.16) -- collegefootballdata.com requires a
          # free API key; without it, cfb.py returns no data (an honest
          # empty result, not a crash) rather than failing the whole run.
          # Add the real key as a repo secret named CFBD_API_KEY once
          # obtained -- see ROADMAP.md's Session 2.16 card.
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/run_pipeline.py --season 2025

      - name: Commit and push updated CLV log and digest
        id: commit
        run: |
          # data/pickem/cache/cfbd/ (Session 2.16) MUST be committed here,
          # same reason as clv_log.csv above: this runner's disk is thrown
          # away at the end of every run (see this file's own "WHAT THIS
          # FILE IS" note), so cfb.py's whole call-budget cache -- the
          # thing keeping this plug-in under CFBD's 1,000-call/month free
          # cap -- would be silently rebuilt from scratch on every single
          # hourly run without this, defeating the entire design.
          git config user.name "pickem-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pickem/clv_log.csv data/pickem/clv_snapshots/ output/digest/ output/estimation/latest.csv data/pickem/cache/cfbd/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Automated pipeline run $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"

          # HOTFIX (2026-09-12): a real run was rejected here with
          # "! [rejected] main -> main (fetch first)" -- this job's own
          # `concurrency` group (top of this file) only stops TWO RUNS OF
          # THIS SAME WORKFLOW from overlapping; it does nothing to stop a
          # race against a completely separate writer pushing straight to
          # `main` in between this job's checkout and this step's push
          # (confirmed real cause that day: a manual, interactive commit
          # landed on `main` a few minutes before this scheduled run tried
          # to push). This is Git correctly refusing to silently clobber
          # that other, real work -- not a bug in the push itself -- so the
          # fix is to catch up and retry, not to force-push over it.
          # Rebasing this bot's own commit onto whatever is newly on
          # origin/main is safe here because this step only ever touches
          # its own small set of pipeline-output paths (see `git add`
          # above) -- a genuine conflicting edit to one of those exact
          # files by something else, in the few seconds this retry window
          # covers, is exceedingly unlikely; if it ever does happen, the
          # rebase stops and this step fails loudly instead of guessing,
          # consistent with this project's standing rule against silently
          # resolving a real conflict rather than surfacing it.
          push_ok=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              push_ok=true
              break
            fi
            echo "Push attempt $attempt/5 was rejected -- fetching and rebasing onto origin/main before retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase onto origin/main hit a real conflict -- stopping rather than guessing at a resolution. Manual intervention needed." >&2
              git rebase --abort
              exit 1
            fi
            sleep $((attempt * 3))
          done

          if [ "$push_ok" != "true" ]; then
            echo "::error::Failed to push after 5 retries against a moving origin/main." >&2
            exit 1
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Hotfix, 2026-09-11: the commit above is deliberately tagged
      # [skip ci] (so an hourly bot commit doesn't re-trigger this same
      # workflow) -- but Cloudflare Pages treats [skip ci] the same way
      # and silently skips auto-deploying that commit too. This was a
      # known, real gap (first hit on the arbitrage track, Session 3.5;
      # recurred here) that left the live frontend showing stale data
      # after a run that DID produce new flags. A Cloudflare Pages
      # "Deploy hook" is a URL that starts a deploy regardless of any
      # git metadata -- POSTing to it here closes the gap for real,
      # rather than relying on someone noticing and manually redeploying.
      # Only runs when the commit step actually pushed something, so a
      # no-op run doesn't trigger a pointless rebuild.
      - name: Trigger Cloudflare Pages deploy
        if: steps.commit.outputs.committed == 'true'
        run: curl -sf -X POST "${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}"

      - name: Upload logs as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            logs/pipeline.log
            logs/ingestion.log
            logs/estimation.log
            logs/clv_logging.log
          retention-days: 14
          if-no-files-found: ignore
