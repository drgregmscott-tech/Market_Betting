# sport_inventory_scan.yml
#
# Purpose (Session 2.10 continuation — deferred item, Open Decision:
# "confirm every sport currently listed on Underdog"):
# Runs sport_inventory_scan_automated.py three times a day, so the
# Underdog sport-inventory check gets real, spread-out data points
# without anyone needing to be at a keyboard when each run happens.
#
# This is a BOUNDED, TEMPORARY workflow, not a permanent addition to the
# pipeline. It should be disabled or deleted once the defined window
# closes (see the plan in docs/research/sport_inventory.md) — matching
# this project's standing practice of explicit, checkable stopping
# conditions rather than a script left running indefinitely for no
# stated reason.
#
# Defined window: runs 3x/day (08:00, 16:00, 00:00 UTC) for 4 days from
# whenever this is first merged — 12 total runs, enough to cover every
# time of day across a full week-cycle including a weekend. After the
# 4th day, this workflow should be manually disabled (see the deferred
# item's own closing instructions) rather than left running.
#
# Each run writes one new dated JSON file to docs/research/scans/ and
# commits it back to the repo, so results are readable later without
# anyone needing to have watched the run happen.

name: Sport Inventory Scan (Session 2.10 deferred item)

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: {}  # allows a manual one-off run from the GitHub Actions tab if needed

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run scan
        run: python scripts/ingestion/sport_inventory_scan_automated.py

      - name: Commit and push results
        run: |
          git config user.name "sport-inventory-scan-bot"
          git config user.email "actions@github.com"
          git add docs/research/scans/
          git diff --cached --quiet || git commit -m "Automated sport inventory scan"
          git push
