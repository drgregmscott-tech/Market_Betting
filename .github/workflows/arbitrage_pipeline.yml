name: Arbitrage Pipeline

# WHAT THIS FILE IS
# ------------------
# A GitHub Actions "workflow" -- a set of instructions GitHub itself runs on
# a schedule, on a temporary computer GitHub provides (a "runner"), separate
# from your own PC. Every run starts from a completely fresh copy of this
# repo; nothing written to that temporary computer's disk survives past the
# end of the run unless this file explicitly saves it back to GitHub first.
# This is the arbitrage track's twin of pickem_pipeline.yml (Session 2.7) --
# same structure, a separate schedule and a separate commit step, so the
# two tracks' automated runs never interfere with each other.
#
# WHAT IT DOES, IN ORDER
# -----------------------
# 1. Checks out this repo onto the temporary computer.
# 2. Installs Python and this project's packages (requirements.txt).
# 3. Runs scripts/run_arbitrage_pipeline.py, which itself runs Kalshi
#    ingestion -> Polymarket ingestion -> venue matching -> arbitrage
#    detection in sequence (Session 3.4).
# 4. If that script succeeds, commits the new candidate-match file, the new
#    arbitrage-flags file, and the new digest file back to this repo, using
#    a token GitHub generates automatically for every workflow run
#    (GITHUB_TOKEN) -- no separate password or secret needed.
# 5. If step 3 fails or finds nothing to commit, the workflow stops there --
#    no commit happens, and the run shows as failed/red on GitHub's Actions
#    tab so a failure is never silent.
#
# WHY THIS DOES NOT COMMIT data/exchange/raw/ OR data/exchange/normalized/
# --------------------------------------------------------------------------
# Those two folders hold this run's raw API responses and normalized
# snapshots -- useful for debugging a single run, but not this project's
# real historical record the way clv_log.csv is for the pick'em track.
# Committing every run's full raw/normalized snapshot (roughly 540 Kalshi
# series plus however many Polymarket events are open at pull time, every
# 15 minutes) would grow this repo very quickly for little real benefit.
# The two files that ARE this track's real audit trail -- the candidate
# matches venue_matcher.py proposed, and the flags detector.py actually
# produced -- are committed every run, matching the "keep what's actually
# needed to reconstruct history, not everything" principle clv_log.csv
# already established for Track 1.
#
# POLLING FREQUENCY -- REAL OPEN DECISION, NOT A CONFIDENT CHOICE
# --------------------------------------------------------------------------
# ROADMAP.md's Session 3.4 validation checkbox requires the polling
# frequency to be "justified against how quickly real arbitrage windows
# are observed to close (not an arbitrary guess)." As of this session,
# that real evidence does not exist yet -- Session 3.2/3.3 found real
# markets consistently efficient (14 markets checked, all priced
# $1.01-$1.04, no genuine arbitrage window to time the closing of).
# Unlike the pick'em track (Session 2.4's CLV logging, which grades
# itself against a closing line and genuinely needs frequent snapshots
# to do that accurately), this detector never compares a run against a
# past run -- every run is a self-contained check of whether both sides
# of a locked position can be bought for under $1.00 RIGHT NOW. Polling
# frequency here is only about the odds of a snapshot landing inside a
# real mispricing's real (currently unknown) lifetime, not about
# building a trend.
#
# 6 runs/day (every 4 hours) is used here as a DELIBERATE, NAMED
# PLACEHOLDER, chosen against two real, checked constraints rather than
# an arbitrary guess:
# - Cost: real GitHub Actions history (both prior manual runs of this
#   workflow) shows one run takes just under 4 minutes of runner time.
#   At 6 runs/day this is about 720 runner-minutes/month -- combined
#   with pickem_pipeline.yml's own real ~960 runner-minutes/month
#   (hourly, ~1m20s/run per its own real run history), this keeps the
#   account's combined Actions usage under its 2,000-minute/month
#   included allowance (GitHub Free plan, confirmed live via the
#   account's own billing page 2026-09-06), leaving headroom for the
#   DFS optimizer repos that also draw from this same account-wide pool.
#   The earlier 15-minute placeholder this replaced would have used
#   roughly 11,500 runner-minutes/month by itself -- confirmed, not
#   estimated, to be a real budget problem, not a theoretical one.
# - Kalshi rate-limit exposure: 6 runs/day keeps total daily requests to
#   Kalshi (~540/run) far lower than a 15-minute cadence would, which
#   matters given Kalshi's real rate limit has never been published (see
#   ingest_kalshi.py's own ACCESS note).
# This gives Session 3.6 (Live Validation Window) several real snapshots
# per day to learn from -- enough to start building real evidence on how
# long a genuine mispricing stays open -- while the person reviewing the
# digest still only needs to check it once a day, since every run's
# result accumulates in output/digest/arbitrage_digest_latest.md and the
# committed flags/matches files regardless of how often it's checked.
# This cadence is still explicitly flagged, here and in SESSION_LOG.md,
# as a placeholder to recalibrate once Session 3.6 produces real timing
# data -- not presented as a final, evidence-based answer.
on:
  schedule:
    # Re-enabled 2026-09-18 at 1x/day (down from 6x/day) -- deliberate cut,
    # not a GH-minutes decision (this repo is now public): a single daily
    # snapshot is enough to keep accumulating real evidence on how long a
    # genuine mispricing stays open (the original goal, see this file's
    # header) while still respecting the Kalshi rate-limit caution this
    # track was already built around. Offset from the exact hour for the
    # same reason pickem_pipeline.yml avoids the exact top of the hour --
    # GitHub's own documentation warns that jobs scheduled for the
    # busiest, most predictable slots on their infrastructure are the
    # most likely to be delayed or skipped. A placeholder to revisit once
    # this track is further along, same as every other cadence in this
    # project.
    - cron: "11 13 * * *"
  workflow_dispatch: {}
  # Adds a manual "Run workflow" button on GitHub's Actions tab, so this
  # can be triggered by hand for testing without waiting for the next
  # scheduled run.

# Prevents two runs from overlapping if one run happens to take longer than
# 15 minutes -- a second scheduled run will wait for the first to finish
# rather than starting in parallel and racing to write the same files.
concurrency:
  group: arbitrage-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  # Required so the final step in this workflow is allowed to commit and
  # push back to this repo using the automatic GITHUB_TOKEN.

jobs:
  run-arbitrage-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Matches pickem_pipeline.yml's own timeout. With runs spaced 4
    # hours apart (see the polling-frequency note above) there is no
    # longer a tight overlap risk the way there was at the earlier
    # 15-minute placeholder cadence, so this no longer needs to be cut
    # unusually short -- 30 minutes is a generous ceiling against a real
    # run that currently takes under 4 minutes.
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (Kalshi + Polymarket ingestion -> venue matching -> arbitrage detection)
        run: python scripts/run_arbitrage_pipeline.py

      - name: Commit and push new candidate matches, flags, and digest
        id: commit
        run: |
          git config user.name "arbitrage-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/exchange/matched/ data/arbitrage/flags/ output/digest/arbitrage_digest_latest.md output/digest/arbitrage_digest_*.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Automated arbitrage pipeline run $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"

          # HOTFIX (2026-09-12, applied project-wide -- see pickem_pipeline.yml
          # for the real incident this responds to): a plain `git push` here
          # can be correctly rejected if anything else pushes to `main`
          # between this job's checkout and this step (another pipeline's own
          # bot commit, or a manual push) -- Git protecting real work, not a
          # bug. Retries by rebasing this bot's own commit onto the latest
          # origin/main, which is safe since this step only ever touches its
          # own narrow set of output paths (see `git add` above); a genuine
          # conflict stops the rebase and fails this step loudly instead of
          # guessing at a resolution.
          push_ok=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              push_ok=true
              break
            fi
            echo "Push attempt $attempt/5 was rejected -- fetching and rebasing onto origin/main before retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase onto origin/main hit a real conflict -- stopping rather than guessing at a resolution. Manual intervention needed." >&2
              git rebase --abort
              exit 1
            fi
            sleep $((attempt * 3))
          done

          if [ "$push_ok" != "true" ]; then
            echo "::error::Failed to push after 5 retries against a moving origin/main." >&2
            exit 1
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Hotfix, 2026-09-11: see pickem_pipeline.yml's own comment on this
      # same step for the full incident -- Cloudflare Pages does not
      # auto-deploy a commit tagged [skip ci], so without this step a real
      # new arbitrage flag could sit unpublished on the live frontend
      # indefinitely. Only fires when the commit step actually pushed
      # something.
      - name: Trigger Cloudflare Pages deploy
        if: steps.commit.outputs.committed == 'true'
        run: curl -sf -X POST "${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}"

      - name: Upload logs as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbitrage-pipeline-logs
          path: |
            logs/arbitrage_pipeline.log
            logs/ingestion.log
            logs/arbitrage.log
          retention-days: 14
          if-no-files-found: ignore
